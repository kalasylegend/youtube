<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abrir en YouTube</title>
<style>
html,body{min-height:100%;margin:0}
body{box-sizing:border-box;min-height:100svh;padding:20px 18px 34px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;background:#111 url("fondo.jpg") center center/cover no-repeat fixed;color:#fff;font-family:system-ui,-apple-system,sans-serif;text-align:center}
main{box-sizing:border-box;width:min(100%,440px);background:rgba(0,0,0,.76);border-radius:18px;padding:20px 18px 22px}
h2{margin:0 0 10px;font-size:23px}p{margin:0 0 12px}
a{display:block;padding:15px;border-radius:12px;background:#e62117;color:white;text-decoration:none;font-weight:700;margin:12px 0}.secondary{background:#eee;color:#222}
small{display:block;color:#ddd;line-height:1.5;margin-top:12px}
</style>
</head>
<body>
<main>
<h2>Abrir en YouTube</h2>
<p>Pulsa el botón para abrir el destino en YouTube.</p>
<a id="app" href="https://www.youtube.com/@kalasylegend">Abrir en la app de YouTube</a>
<a id="browser" class="secondary" href="https://www.youtube.com/@kalasylegend">Ver en el navegador</a>
</main>
<script>
(function(){
'use strict';
const defaultUrl='https://www.youtube.com/@kalasylegend';
const params=new URLSearchParams(window.location.search);
const id=params.get('v');
const validVideo=id && /^[a-zA-Z0-9_-]{11}$/.test(id);
const android=/Android/i.test(navigator.userAgent);
const ios=/iPhone|iPad|iPod/i.test(navigator.userAgent);
const app=document.getElementById('app');
const browser=document.getElementById('browser');
function launch(target){
  browser.href=target;
  let appUrl=target;
  if(android){
    // Keep the same Android intent pattern as the version already tested on GitHub Pages.
    const destination=target.replace(/^https:\/\//,'');
    appUrl='intent://'+destination+'#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url='+encodeURIComponent(target)+';end';
  }else if(ios){
    const video=target.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
    appUrl=video?'youtube://'+video[1]:'youtube://www.youtube.com/@kalasylegend';
  }
  app.href=appUrl;
  // No redirección automática: evita que Instagram reutilice el vídeo anterior.
}
if(validVideo){
  launch('https://www.youtube.com/watch?v='+encodeURIComponent(id));
}else{
  // principal.txt contains a YouTube channel or video URL, one line only.
  fetch('principal.txt?rev=2',{cache:'no-store'}).then(function(r){if(!r.ok)throw Error('missing');return r.text();}).then(function(t){
    const line=t.trim().split(/\r?\n/)[0].trim();
    const u=new URL(line);
    if(!['youtube.com','www.youtube.com','m.youtube.com','youtu.be'].includes(u.hostname)||u.protocol!=='https:')throw Error('invalid');
    launch(u.href);
  }).catch(function(){launch(defaultUrl);});
}
})();
</script>
</body>
</html>
